version: '3.8'

# Development-only services
services:
  postgres:
    image: postgres:15-alpine
    container_name: bom-postgres-dev
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bom_study_tools_dev
    ports:
      - '5433:5432'
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: bom-redis-dev
    ports:
      - '6381:6379'
    volumes:
      - redis_dev_data:/data

  qdrant:
    image: qdrant/qdrant:latest
    container_name: bom-qdrant-dev
    ports:
      - '6333:6333'
      - '6334:6334'
    volumes:
      - qdrant_dev_data:/qdrant/storage

  mailhog:
    image: mailhog/mailhog:latest
    container_name: bom-mailhog
    ports:
      - '1025:1025' # SMTP
      - '8025:8025' # Web UI
    logging:
      driver: 'none'

volumes:
  postgres_dev_data:
  redis_dev_data:
  qdrant_dev_data:
