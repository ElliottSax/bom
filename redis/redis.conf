# Redis production configuration
# Security-hardened settings

# Network and Security
bind 0.0.0.0
protected-mode yes
port 6379

# Authentication
requirepass CwNwLIlAZmB7szCSTlcj57paSIpjk+kTlXJEsyzp7X0=

# Memory Management
maxmemory 256mb
maxmemory-policy allkeys-lru

# Persistence (RDB Snapshotting)
save 900 1
save 300 10
save 60 10000

# Append Only File (AOF) - Better durability
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec

# Logging
loglevel notice
logfile ""

# Security - Disable dangerous commands by renaming them to empty string
rename-command FLUSHDB ""
rename-command FLUSHALL ""
rename-command KEYS ""
rename-command CONFIG "CONFIG_a1b2c3d4e5"
rename-command SHUTDOWN "SHUTDOWN_a1b2c3d4e5"
rename-command DEBUG ""
rename-command EVAL ""
rename-command SCRIPT ""

# Limits
timeout 300
tcp-keepalive 300
maxclients 128

# Performance
tcp-backlog 511
databases 1